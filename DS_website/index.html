<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Data Lab | Data Science Digital Library</title>
  <meta name="description" content="Nova Data Lab is an interactive digital library and Python virtual laboratory for Data Science education, experiments, modules, and progress analytics.">
  <meta name="author" content="Joshitha Upati">
  
  <!-- Modern Typography from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/editor.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css" media="print" onload="this.media='all'">

  <link rel="icon" type="image/svg+xml" href="assets/images/avatar-placeholder.svg">
</head>
<body>
  <!-- Fixed App Header -->
  <header class="app-header" id="app-header" role="banner"></header>

  <!-- Main Viewport Router Container -->
  <main class="app-main" id="app-root" role="main" aria-live="polite">
    <div style="display:flex; justify-content:center; align-items:center; min-height:50vh; color:#64748b; font-size:1rem;">
      <div style="text-align:center;">
        <div style="font-weight:700; font-family:var(--font-heading); font-size:1.25rem; color:var(--text-main); margin-bottom:0.5rem;">
          Loading Data Science Subject Digital Library...
        </div>
        <div>Initializing academic modules and virtual laboratory runtime.</div>
      </div>
    </div>
  </main>

  <!-- App Bootstrap Module -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
