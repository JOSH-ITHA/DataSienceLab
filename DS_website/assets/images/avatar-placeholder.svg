<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gradAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="gradFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="url(#gradBg)"/>
  <!-- Decorative Ring -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="url(#gradAcc)" stroke-width="3" stroke-dasharray="8 6"/>
  <!-- Inner Silhouette -->
  <g transform="translate(0, 10)">
    <!-- Shoulders / Academic Coat -->
    <path d="M 40 165 C 40 125, 70 120, 100 120 C 130 120, 160 125, 160 165 C 160 178, 145 185, 100 185 C 55 185, 40 178, 40 165 Z" fill="url(#gradAcc)" opacity="0.9"/>
    <path d="M 75 125 L 100 155 L 125 125 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M 92 135 L 100 170 L 108 135 Z" fill="#1e293b"/>
    <!-- Head -->
    <circle cx="100" cy="78" r="34" fill="url(#gradFace)"/>
    <!-- Academic Cap / Hair representation -->
    <path d="M 68 70 C 68 50, 82 42, 100 42 C 118 42, 132 50, 132 70 C 122 64, 112 62, 100 62 C 88 62, 78 64, 68 70 Z" fill="#1e293b"/>
  </g>
  <!-- Data Science Node overlay -->
  <circle cx="155" cy="45" r="18" fill="#3b82f6" opacity="0.9"/>
  <text x="155" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">DS</text>
</svg>
